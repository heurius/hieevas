[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hieevas"
version = "0.1.0"
description = "Hierarchical evaluation of agentic systems (HIEEVAS): 27 process, cost, robustness, safety and governance metrics at agent, interaction and system level, computed from execution traces of LangGraph and OpenTelemetry-instrumented agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sampathkumar T.", email = "heurius.tech@gmail.com" }]
keywords = ["agentic-ai", "ai-agents", "llm", "evaluation", "metrics", "langgraph", "langchain", "rag",
            "opentelemetry", "observability", "ai-governance", "prompt-injection", "vertex-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
langgraph = ["langchain-core>=0.3", "langgraph>=0.2"]
pandas = ["pandas>=2.0"]
otel = ["opentelemetry-sdk>=1.20"]
agentcore = ["opentelemetry-sdk>=1.20", "boto3>=1.34"]
vertex = ["opentelemetry-sdk>=1.20", "google-cloud-trace>=1.13"]
# live tracing of LangGraph apps: local mode ("file") and any OTLP collector
live = ["opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp-proto-http>=1.20",
        "openinference-instrumentation-langchain>=0.1.20"]
# cloud mode (Cloud Run / VM -> Cloud Trace) and reading Cloud Trace for any mode, incl. Agent Engine
gcp = ["opentelemetry-sdk>=1.20", "opentelemetry-exporter-gcp-trace>=1.6", "google-cloud-trace>=1.13",
       "openinference-instrumentation-langchain>=0.1.20"]
dev = ["pytest>=8", "langchain-core>=0.3", "langgraph>=0.2", "opentelemetry-sdk>=1.20"]

[project.scripts]
hieevas-dashboard = "hieevas.serve:main"

[project.urls]
Homepage = "https://github.com/heurius/hieevas"
Repository = "https://github.com/heurius/hieevas"
Issues = "https://github.com/heurius/hieevas/issues"
Documentation = "https://github.com/heurius/hieevas/blob/main/METRICS.md"
Changelog = "https://github.com/heurius/hieevas/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hieevas = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
